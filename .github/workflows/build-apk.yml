name: Сборка APK

# Запускается вручную (вкладка Actions -> Сборка APK -> Run workflow),
# а также при каждом изменении кода в ветке main/master.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Готовим Android SDK нужной версии и принимаем лицензии:
      # иначе сборка падает с «Failed to find target with hash string android-34».
      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Платформа Android 34 и инструменты сборки
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      # Gradle ставится сам, поэтому отсутствующий gradle-wrapper.jar не мешает сборке.
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Тесты разбора ответов площадок
        run: gradle test --no-daemon --stacktrace

      - name: Сборка APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Показать, что получилось
        run: ls -l app/build/outputs/apk/debug/

      - name: Отдать APK файлом для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: ChinaSourcing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
